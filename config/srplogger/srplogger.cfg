# Configuration file

permissions {
    # Master switch for SRP Logger. When false, logging, windows, packets, debug, overlays and server actions are disabled. Requires a restart. [default: true]
    B:enabled=true

    # Minecraft username treated as the dedicated server owner by SRP Logger. Leave empty until configured. [default: ]
    S:teleportOwnerName=

    # Optional UUID for the server owner. When set, it is checked before the username. [default: ]
    S:teleportOwnerUuid=
}

logs_window {
    # When true, everyone can view Logs except players in the list. When false, only listed players can view it. [default: true]
    B:enabledForAll=true

    # Player names or UUIDs. Blacklist when enabledForAll=true; whitelist when enabledForAll=false. [default: ]
    S:players <
     >
}



